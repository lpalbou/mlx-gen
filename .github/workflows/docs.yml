name: Docs

on:
  # Release tags are the deploy signal. The GitHub Release itself is created by the
  # Release workflow's GITHUB_TOKEN, and GitHub does not start workflows from events
  # raised by that token, so `release: published` never fires for our releases.
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy-docs:
    name: Build and deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "mkdocs>=1.6.0" "mkdocs-material>=9.0.0" "pymdown-extensions>=10.0"
      - name: Prepare MkDocs sources
        run: bash .github/scripts/prepare_mkdocs.sh
      - name: MkDocs build check
        run: mkdocs build -q
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy MkDocs site
        run: mkdocs gh-deploy --force --clean --message "Deploy docs for ${{ github.event.release.tag_name || github.ref_name }}"
